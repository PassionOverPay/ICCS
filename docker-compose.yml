services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commonground
      POSTGRES_USER: commonground
      POSTGRES_PASSWORD: commonground
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://commonground:commonground@db:5432/commonground
      SECRET_KEY: replace-with-a-long-random-value
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:

